<!-- ORDER MODAL BACKDROP & CARD -->
<div id="orderModalBackdrop" class="modal-backdrop"></div>
<div id="orderModalCard" class="modal-card">
  <div class="modal-header">
    <h3 class="font-title-md text-primary">Formulir Pesanan WhatsApp</h3>
    <button id="closeModalBtn" class="modal-close-btn" aria-label="Tutup modal">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <form id="orderForm">
    <div class="form-group">
      <label for="custName" class="form-label">Nama Lengkap Anda</label>
      <input type="text" id="custName" class="form-input" placeholder="Contoh: Budi Santoso" required>
    </div>

    <div class="form-group">
      <label for="custPhone" class="form-label">Nomor HP / WhatsApp</label>
      <input type="tel" id="custPhone" class="form-input" placeholder="Contoh: 081234567890" required>
    </div>

    <div class="form-group">
      <label for="orderProductSelect" class="form-label">Pilihan Varian Produk</label>
      <select id="orderProductSelect" class="form-select" required>
        <option value="Kerupuk Bawang Bulat (250g)">Kerupuk Bawang Bulat (250g) - Rp 15.000</option>
        <option value="Kerupuk Bawang Panjang (250g)">Kerupuk Bawang Panjang (250g) - Rp 15.000</option>
        <option value="Kerupuk Bawang Bulat (500g)">Kerupuk Bawang Bulat (500g) - Rp 28.000</option>
        <option value="Kerupuk Bawang Panjang (500g)">Kerupuk Bawang Panjang (500g) - Rp 28.000</option>
        <option value="Kerupuk Mentah Siap Goreng (500g)">Kerupuk Mentah Siap Goreng (500g) - Rp 25.000</option>
        <option value="Kerupuk Mentah Siap Goreng (1kg)">Kerupuk Mentah Siap Goreng (1kg) - Rp 48.000</option>
      </select>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="orderQtyInput" class="form-label">Jumlah (Bungkus)</label>
        <input type="number" id="orderQtyInput" class="form-input" value="1" min="1" required>
      </div>
      <div class="form-group">
        <label class="form-label">Total Subtotal</label>
        <div id="totalPriceDisplay" style="font-weight: 800; font-size: 1.1rem; color: var(--color-primary); padding: 12px 0;">
          Rp 15.000
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="custAddress" class="form-label">Alamat Pengiriman Lengkap</label>
      <textarea id="custAddress" class="form-textarea" rows="2" placeholder="Jalan, RT/RW, Desa/Kelurahan, Kecamatan, Kota/Kabupaten" required></textarea>
    </div>

    <div class="form-group">
      <label for="custNote" class="form-label">Catatan Khusus (Opsional)</label>
      <input type="text" id="custNote" class="form-input" placeholder="Contoh: Titip di satpam / Packing ekstra aman">
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 12px;">
      <span class="material-symbols-outlined">send</span> Kirim Pesanan via WhatsApp
    </button>
  </form>
</div>
